<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คอนแทค | My Portfolio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #f9f9f9; color: #333; line-height: 1.6; }
        header { background-color: #2c3e50; position: fixed; width: 100%; top: 0; left: 0; z-index: 1000; }
        nav { display: flex; justify-content: space-between; align-items: center; max-width: 1100px; margin: 0 auto; padding: 20px; }
        nav .logo { color: #fff; font-size: 24px; font-weight: bold; text-decoration: none; }
        nav ul { display: flex; list-style: none; }
        nav ul li { margin-left: 20px; }
        nav ul li a { color: #fff; text-decoration: none; font-size: 16px; }
        nav ul li a:hover, nav ul li a.active { color: #3498db; }
        .container { max-width: 900px; margin: 120px auto 80px auto; padding: 20px; }
        h2 { font-size: 32px; color: #2c3e50; margin-bottom: 30px; border-bottom: 4px solid #3498db; padding-bottom: 10px; display: inline-block; }
        .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .contact-card { display: block; text-align: center; padding: 25px; background: white; color: #2c3e50; text-decoration: none; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: bold; transition: all 0.3s; border: 1px solid #eee; }
        .contact-card:hover { background-color: #3498db; color: white; transform: translateY(-5px); }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">MyPortfolio</a>
            <ul>
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="profile.html">ประวัติส่วนตัว</a></li>
                <li><a href="education.html">ประวัติการศึกษา</a></li>
                <li><a href="works.html">ผลงานและกิจกรรม</a></li>
                <li><a href="contact.html" class="active">คอนแทค</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2>ช่องทางการติดต่อ</h2>
        <p>หากคุณสนใจร่วมงานหรือต้องการสอบถามข้อมูลเพิ่มเติม สามารถติดต่อได้ที่ช่องทางด้านล่างนี้:</p>
        
        <div class="contact-grid">
            <a href="mailto:your-email@example.com" class="contact-card">📧 อีเมลของคุณ</a>
            <a href="https://linkedin.com" target="_blank" class="contact-card">💼 LinkedIn</a>
            <a href="https://github.com" target="_blank" class="contact-card">🐙 GitHub</a>
            <a href="tel:0123456789" class="contact-card">📞 เบอร์โทรศัพท์</a>
        </div>
    </div>
</body>
</html>
